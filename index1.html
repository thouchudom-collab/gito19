<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហាងភេសជ្ជៈស្រស់ថ្លា - Fresh Drinks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍹 Fresh Drinks Cafe</h1>
        <p>ភេសជ្ជៈឆ្ងាញ់ៗ ស្រស់ស្រាយរាល់ថ្ងៃ!</p>
    </header>

    <main class="container">
        <h2>ម៉ឺនុយភេសជ្ជៈប្រចាំហាង</h2>
        
        <div class="drink-grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=300" alt="Iced Coffee">
                <h3>កាហ្វេទឹកកក (Iced Coffee)</h3>
                <p class="price">$2.00</p>
                <button onclick="addToCart('កាហ្វេទឹកកក')">ទិញឥឡូវនេះ</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?w=300" alt="Orange Juice">
                <h3>ទឹកក្រូចស្រស់ (Fresh Orange)</h3>
                <p class="price">$1.50</p>
                <button onclick="addToCart('ទឹកក្រូចស្រស់')">ទិញឥឡូវនេះ</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1556881286-fc6915169721?w=300" alt="Green Tea">
                <h3>តែបៃតង (Matcha Green Tea)</h3>
                <p class="price">$2.50</p>
                <button onclick="addToCart('តែបៃតង')">ទិញឥឡូវនេះ</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Fresh Drinks. រក្សាសិទ្ធិគ្រប់យ៉ាង។</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
